services:
  - type: web
    name: omniagent
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_CODING_MODEL
        value: cohere/north-mini-code:free
      - key: OPENROUTER_GENERAL_MODEL
        value: openrouter/free
      - key: HF_API_KEY
        sync: false
      - key: HF_IMAGE_MODEL
        value: stabilityai/stable-diffusion-3-medium-diffusers
      - key: HF_STT_MODEL
        value: openai/whisper-large-v3-turbo
    # No persistent disk here: Render's free plan doesn't support one, so
    # the SQLite file lives on ephemeral storage and resets on every
    # redeploy/restart (accounts, sessions, chat logs all wiped). Add a
    # paid-plan disk block (see Render's docs) if that data needs to survive
    # deploys, or swap server/db.js for a hosted DB (e.g. Turso, Supabase).
